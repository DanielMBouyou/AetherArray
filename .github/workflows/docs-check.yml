name: docs

# This CI does not build anything yet: the repository is in its study phase.
# It only checks that the documentation follows the repository conventions.
# Simulation and synthesis CI is described in docs/ci-strategy.md and will be
# added when there is code to build.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks
        run: bash tools/check-docs.sh
